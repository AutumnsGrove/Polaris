id: fo-short-why-not-brief
track: focus
rationale: >-
  Trap: a very short message that looks brief-worthy but asks "why", which is the
  first_principles description ("understand why or how something works"). The message never
  asks for a short answer and is not a single-fact lookup. The added "why, not just that it
  is" makes the wish to understand the mechanism explicit.
state:
  latest: "why is the sky blue? i want the actual reason, not just that it is"
expect:
  focus: {answer: first_principles}
quiet:
  - emotional
  - private_person
