id: hs-landlord-keeping-deposit
track: high_stakes
rationale: >-
  Tenant dispute about a withheld security deposit: "rights, disputes, legal procedure" in the
  legal option. Money is involved, but the question is about legal entitlement and process, so
  legal is the best fit; financial is not a defensible primary label here.
state:
  latest: "I moved out of my apartment last month, and my landlord is keeping my entire security deposit for 'normal wear and tear'. Can he legally do that in Texas, and what should I do about it?"
expect:
  high_stakes: {answer: legal}
quiet:
  - private_person
