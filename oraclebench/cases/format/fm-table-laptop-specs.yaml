id: fm-table-laptop-specs
track: format
rationale: >-
  Several named items compared across the same attributes (weight, battery, price) is the
  textbook table. Nobody is asking for a pick, so table beats comparison. ui=compare is the
  matching block shape.
state:
  latest: "Please make me a table comparing the weight, battery life, and price of the ThinkPad X1 Carbon, the Dell XPS 13, and the LG Gram 14."
expect:
  format: {answer: table}
  ui: {answer: compare}
quiet:
  - emotional
  - private_person
