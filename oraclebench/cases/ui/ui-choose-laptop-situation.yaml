id: ui-choose-laptop-situation
track: ui
rationale: >-
  No named products: the person gives their situation (photo editing, travel, budget) and asks
  what to get. The best answer is a set of if-then rules, which is the choose description
  exactly, not a compare table of named options. format=list or comparison is acceptable.
state:
  latest: "What kind of laptop should I get? I edit photos on the weekends, I travel frequently, and my budget is around $1,500."
expect:
  ui: {answer: choose, accept: [choose, compare]}
  task: {answer: decide}
quiet:
  - emotional
  - private_person
