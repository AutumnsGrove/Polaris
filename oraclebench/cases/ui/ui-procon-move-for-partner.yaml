id: ui-procon-move-for-partner
track: ui
rationale: >-
  A personal decision being weighed (moving cities for a partner's job) wanting arguments for
  and against: procon. Not views (not a public question where camps disagree), not compare
  (no two named options), not choose (they want the weighing, not rules by situation).
  Distressed-sounding words are absent, so emotional stays quiet.
state:
  latest: "My partner has accepted a job in Portland and would like me to move with her. Could you lay out the pros and cons of going versus staying here in Ohio?"
expect:
  ui: {answer: procon, accept: [procon, compare]}
  task: {answer: decide}
quiet:
  - private_person
