# Generated by pi-review from .github/pi-review.json
# Edit the settings file, not this workflow. The job lives once, in
# AutumnsGrove/pi-extensions/.github/workflows/pi-review-reusable.yml, and runs from @main,
# so a fix there reaches this repository without a commit here.
name: pi-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: >-
    ${{ (((github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@pi') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && github.event.comment.user.type != 'Bot')))
    && format('pi-review-{0}', github.event.pull_request.number || github.event.issue.number)
    || format('pi-review-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@pi') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && github.event.comment.user.type != 'Bot')
    uses: AutumnsGrove/pi-extensions/.github/workflows/pi-review-reusable.yml@main
    with:
      settings-path: '.github/pi-review.json'
      review-timeout-minutes: 20
      job-timeout-minutes: 33
      install-dependencies: true
    secrets: inherit
