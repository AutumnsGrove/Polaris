id: compaction-retains-numbers
category: agent_loop
kind: compaction_retention
history:
- role: user
  content: What's the current price of a Framework 13 laptop and how does it compare to a similarly specced
    ThinkPad?
- role: assistant
  content: The Framework 13 starts at $1,049 for a barebones DIY edition with a Ryzen 7 7840U, or $1,399
    pre-built. A similarly specced ThinkPad X1 Carbon Gen 12 with a comparable CPU runs about $1,650.
    The Framework's main advantage is repairability — user-replaceable everything, including the mainboard
    itself — while the ThinkPad has a slightly better keyboard and a more mature support ecosystem for
    business use.
must_contain_facts:
- $1,049
- $1,399
- $1,650
- repairability
