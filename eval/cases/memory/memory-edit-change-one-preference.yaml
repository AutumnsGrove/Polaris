memories:
- name: feedback-answer-style
  type: feedback
  description: How they want answers written - concise, Fahrenheit, no emojis
  content: |-
    Keep answers concise and skip the preamble. Use Fahrenheit for temperatures. Never use emojis.
    Why: they read on a phone and find long or decorated replies tiring.
    How to apply: every answer, unless they ask for depth.
must_contain_facts: [Celsius, concise, emoji, phone, How to apply]
must_not_contain: [Fahrenheit]
