services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./compose/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    ports:
      # Loopback-only by default, same posture as polaris's own port below
      # — SearXNG has no auth of its own, so publishing it wide open by
      # default would hand out an anonymous search proxy to anything that
      # can reach the host. Override SEARXNG_HOST=0.0.0.0 in .env if this
      # host is already access-controlled some other way (e.g. only
      # reachable over a private tailnet) and direct browser/LAN access to
      # SearXNG itself is wanted, alongside polaris still talking to it
      # over the compose network's built-in DNS either way
      # (http://searxng:8080, see compose/polaris/config.yaml.example).
      - "${SEARXNG_HOST:-127.0.0.1}:${SEARXNG_PORT:-8888}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  polaris:
    build: .
    # POLARIS_IMAGE lets the update watcher (compose/watcher/update.sh)
    # pin this to an exact digest from .env before recreating the
    # container — see that script's comment on why a floating :latest
    # tag isn't good enough for what "Update Polaris" actually pulls.
    # Unset/default is fine for local dev (`docker compose up --build`).
    image: ${POLARIS_IMAGE:-ghcr.io/autumnsgrove/polaris:latest}
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    # Lets the container reach host.docker.internal — needed only for
    # config.yaml's ollama.base_url (agent/query_similarity.go's
    # query-similarity signal), since Ollama itself isn't containerized
    # in this stack. host-gateway resolves to the Docker bridge's gateway
    # IP on Linux (e.g. 172.17.0.1) — a loopback-only Ollama (the default)
    # refuses that connection; it must be bound to 0.0.0.0 (or at least
    # the bridge IP) on the host for this to actually work. Verified live
    # against the potato: 127.0.0.1-bound Ollama got "connection refused"
    # from inside a container even with this entry present; rebinding to
    # 0.0.0.0 fixed it. Harmless to leave in place even when
    # ollama.base_url is unset (config.go's default) — an unused DNS entry.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # config.yaml's ${VAR} placeholders are expanded inside the polaris
    # process itself (config.Load -> os.ExpandEnv), so these have to
    # reach the *container's* environment, not just the host shell that
    # ran `docker compose up` — Compose doesn't forward arbitrary host
    # env vars in without being told to. Values come from .env (copy
    # .env.example); a name with no value here means "pull it from
    # .env/the host env", same convention .env.example documents.
    environment:
      - OPENROUTER_API_KEY
      - FOURSQUARE_API_KEY
      - TAVILY_API_KEY
      - BRAVE_API_KEY
      - PARALLEL_API_KEY
      - GITHUB_TOKEN
      - LASTFM_API_KEY
      - HARDCOVER_API_KEY
      - TMDB_API_KEY
      - R2_ACCOUNT_ID
      - R2_ACCESS_KEY_ID
      - R2_SECRET_ACCESS_KEY
      # Read by gateway/version.go's deploymentMode() — purely a display
      # signal for the settings panel's version row (bare-metal vs
      # Docker icon). Fixed, not overridable via .env: this needs to
      # reflect how the process is actually running, not an operator
      # preference.
      - POLARIS_DEPLOYMENT=docker
      # Mirrors the same image: field above into the container's own
      # environment, so handleDockerRestart (gateway/docker_update.go)
      # can tell the update watcher "recreate from whatever's already
      # running" without re-resolving a digest from GHCR — the Docker
      # equivalent of handleRestart's bare-metal "no git pull, no build,
      # just restart". Compose has no built-in way for a container to
      # introspect its own `image:` value otherwise.
      - POLARIS_RUNNING_IMAGE=${POLARIS_IMAGE:-ghcr.io/autumnsgrove/polaris:latest}
    ports:
      # Override with POLARIS_PORT in .env if 8899 is already taken on
      # the host (e.g. a bare-metal Polaris still running alongside this).
      - "127.0.0.1:${POLARIS_PORT:-8899}:8899"
    volumes:
      # State: database, logs, attachments — everything config.yaml
      # points at under /data (see compose/polaris/config.yaml.example).
      - polaris-data:/data
      # Hand-editable files, bind-mounted so host edits take effect
      # without a rebuild — see the Dockerfile's comment on why these
      # are copied into the image AND mounted here.
      #
      # The config is mounted as its *directory*, not as the single file it
      # used to be. Docker resolves a file bind mount to the inode that existed
      # at container start, so any edit that replaces the file rather than
      # rewriting it — `sed -i`, `mv`, `git checkout`, most GUI editors — was
      # invisible to the running container: it kept serving the old config until
      # something recreated it. That bit on a real attempt to roll the Nova loop
      # back with `sed -i` (docs/plans/nova-loop.md §14), and it applies to every
      # field gateway/server.go's liveConfig re-reads per request, not just
      # `nova_loop`. Mounting the directory makes the path resolve per read, so
      # an in-place write and a replace both land. That moves the container's
      # config path to /data/config/config.yaml (Dockerfile CMD), so the image
      # and this file have to land together — `polaris update` does exactly that
      # (compose/watcher/update.sh syncs the checkout before recreating); a bare
      # `docker compose pull` against an old checkout would instead crash-loop
      # on a missing config. The three below are still
      # single-file mounts: edit those in place (vim/nano's normal save) or
      # recreate the container, or the same trap applies.
      - ./compose/polaris:/data/config:ro
      - ./prompt.md:/app/prompt.md:ro
      - ./prompts.yaml:/app/prompts.yaml:ro
      - ./blocked_sources.txt:/app/blocked_sources.txt:ro
      - ./tools/descriptions:/app/tools/descriptions:ro
      # Not :ro like the three above — this one is also written by the
      # ranking popover UI (search.SetDomainRanking), not just
      # hand-edited. Without a real write path here, a Docker user's
      # "block this domain" click would appear to succeed (writing into
      # the container's own writable layer) and then silently vanish on
      # the next `polaris update`/force-recreate. install.sh chmods the
      # host file so the container's non-root uid can actually write it.
      - ./domain_rankings.yaml:/app/domain_rankings.yaml
      # Plain host bind mount (not the polaris-data named volume) — the
      # host-side update watcher (compose/watcher/update.sh) needs
      # direct filesystem access to this from outside any container,
      # which a named volume doesn't offer without extra indirection.
      # Polaris writes update-signal/requested here (see
      # gateway/docker_update.go); the watcher reads it and writes
      # update-signal/result back.
      - ./update-signal:/data/update-signal
      # Same plain-host-bind-mount reasoning as update-signal above, for
      # code_exec's own host-side handoff (see tools/code_exec.go,
      # compose/watcher/codeexec.sh) — the host-side sandbox runner
      # needs direct filesystem access from outside any container.
      - ./code-exec-signal:/data/code-exec-signal
      # The per-thread workspace root code_exec reads/writes files
      # under (see docs/plans/code-execution.md's "File persistence").
      # Also a plain host bind mount, not the polaris-data named volume:
      # compose/watcher/codeexec.sh needs the real host path to bind-
      # mount into the ephemeral sandbox container it launches — a named
      # volume's mountpoint isn't something a script outside Docker's
      # own volume management can address directly. This is why
      # compose/polaris/config.yaml.example's code_exec.host_workspace_dir
      # exists as a separate setting from workspace_dir above (this
      # mount's target): the two describe the same directory from two
      # different vantage points (inside this container vs. on the
      # real host), and only the host script needs the latter.
      - ./workspaces:/data/workspaces

volumes:
  polaris-data:
