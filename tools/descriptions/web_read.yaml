name: web_read
category: research
description: >-
  fetch a URL and extract its content (optionally filtered to just what's needed). Long results
  are cut off with a note telling you the offset (web pages) or page (PDFs) to pass back for the
  next chunk — see "Know when to stop researching" for when that's actually worth doing. For
  looking something up inside a long PDF, fetch_url + code_exec can search the whole file at
  once (see fetch_url) instead of paging through it.
api_description: >-
  Fetch a URL and extract its clean text content. Use when the user shares a link, or a
  web_search result needs deeper investigation. Optionally pass 'instructions' to extract only
  specific information (e.g. 'just the prices', 'just the release date') instead of the full
  page. Long results are cut off with a note telling you how to read the rest: pass that same
  'offset' back for a normal web page, or that same 'page' back for a PDF. 'force_tavily' is an
  absolute last resort for when you already have specific reason to believe a plain read gave
  stale data (e.g. a live-updating page) — it costs a real, limited paid credit, so don't set it
  by default.
  Reddit is read through a third-party community archive (Reddit itself blocks bots). That means
  a thread arrives complete with its comments, but the archive can be missing very recent posts
  and replies, and its "score" and comment count are often out of date — say so if the numbers
  matter. Don't retry a failed Reddit read and don't fall back to force_tavily (Reddit refuses
  it); treat the link as a bonus source and lean on search snippets when it fails.
