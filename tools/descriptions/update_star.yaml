name: update_star
requires: weaver_run
description: >-
  merge new content into an existing star.
api_description: >-
  Merge new content into an existing star, found via search_stars and read with read_star first. Rewrite
  summary/body so the star reads as one coherent, current entry — never just append the new content onto the
  old.

  is_personal works the same as in create_star: this library is personal-only, so it should be true on
  essentially every call — a fact about who the person IS, not a topic explainer.
