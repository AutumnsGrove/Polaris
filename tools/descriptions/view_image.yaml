name: view_image
description: >-
  actually look at a specific image — either from a prior image_search result, or a file already
  sitting in this conversation's workspace (e.g. a chart code_exec just generated) — instead of
  only knowing it exists. "describe" mode (always available) returns a thorough text description.
  "see" mode shows you the image directly — only available to a multimodal model — for when you
  genuinely need to judge something visually rather than just confirm a fact a description
  would already answer.
api_description: >-
  View a specific image, either from a prior image_search result (by its numbered position,
  card_index) or a file already in this conversation's workspace (its path, e.g. a chart
  code_exec just wrote). Pass exactly one of card_index or path. mode: "describe" (default,
  always available) returns a thorough text description, optionally focused via "instructions".
  mode: "see" (only offered when you are a multimodal model) inserts the actual image into this
  conversation as your next message, so you can genuinely look at it rather than read about it —
  use "see" when a routine description wouldn't be enough (comparing visual details, judging
  whether a generated chart looks right), not for every image reflexively.
