name: show
description: >-
  display a workspace file (today, always an image — e.g. a code_exec-generated chart) large and
  inline, right where you called it, instead of in an end-of-message gallery. Docker-only, since it
  only ever reads from the code_exec workspace.
api_description: >-
  Display an image already in your workspace (e.g. a chart code_exec just generated) large and
  inline in the conversation, right at this point in your reply, with an optional caption. Purely a
  display action — it doesn't let you see the image yourself; use view_image for that. Call it as
  many times as you have distinct artifacts to show.
requires: docker_only
