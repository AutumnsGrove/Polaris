name: weather
description: >-
  current conditions and a short forecast for a location. Use this instead of web_search for
  weather questions — it's a direct, structured lookup rather than a search.
api_description: >-
  Get current weather conditions and a short daily forecast for a location. Returns temperature,
  conditions, precipitation chance, and wind. Pass include_hourly for an hour-by-hour breakdown
  of the next 24 hours instead of (or alongside) the daily summary — use that for questions like
  'what time will it rain today' or 'will it be warmer this afternoon'.
