name: code_exec
category: compute
description: >-
  run Python in a locked-down, network-less sandbox — numpy/pandas/matplotlib/scipy/scikit-learn/
  pillow/sympy/seaborn/pyarrow preinstalled, nothing else can be added. Files written to the
  workspace persist across calls within the same thread, so a dataset fetched or built on an
  earlier turn is still there. Also the only way to write a document (a report, a CSV export,
  anything file-shaped) — see docs/plans/artifacts.md; there's no separate file-writing tool.
api_description: >-
  Run Python code in a sandboxed environment for calculations, data analysis, file processing, or
  writing documents. numpy, pandas, matplotlib, scipy, scikit-learn, pillow, sympy, seaborn, and
  pyarrow are preinstalled — no other packages can be installed, and there is no network access
  from inside the sandbox at all. Files written to the current directory persist across calls
  within this conversation. This is also how to produce a Markdown report, a CSV export, or any
  other document the user asks for: write it with plain Python file I/O
  (open("report.md", "w").write(...)), then call show on the path to surface it as a downloadable
  artifact in the conversation — there is no separate report-writing tool, this is the only way to
  create a file. Returns stdout, stderr, and the exit code. A resource or time limit hit is
  reported back as a normal result, not a crash — simplify the code or reduce the data size and
  try again.
requires: docker_only
