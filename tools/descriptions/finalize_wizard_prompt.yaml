name: finalize_wizard_prompt
requires: wizard
description: >-
  end the interview and hand back the drafted text.
api_description: >-
  End the interview and hand back the finished, ready-to-use text — what it is (a routine's
  recurring prompt, a Daily block's instructions, a Field's custom instructions, ...) is set by
  the system prompt above. Call this once you have enough to write something genuinely good —
  specific enough it won't need to be re-asked every time, clear about what to focus on or skip.
  Don't call this after just one exchange unless the user's very first message already gave you
  everything you need.

  Write `prompt` the way you'd write it if you were about to use it yourself right now, not a
  description of what it will do — e.g. "Give me a quick rundown of the biggest news in the Guild
  Wars 3 community today" rather than "A routine that checks Guild Wars 3 news", or "focus on AI
  and climate policy" rather than "A block that covers AI and climate policy".

  Calling this tool ENDS the turn, same as ask_user_question. The user may still send another
  message afterward to keep refining — if they do, treat it as a request to revise the draft and
  call this again with the updated text.
