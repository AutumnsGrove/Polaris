name: memory
requires: memory_store
description: >-
  write, edit, view, or forget durable memories about the user or ongoing work.
api_description: >-
  Persist durable facts across threads — the current index of everything you already know is
  always shown to you above, in the "Memories" section; use this tool to add to, correct, or fetch
  the full text of that index.


  Default to NOT writing. Most personal details mentioned in passing don't clear the bar — a
  single offhand remark ("I take my coffee black", "I'm bad with directions") only belongs in
  memory if it's the kind of thing that would change how you answer many future, unrelated
  questions, not just help with the one being asked right now. If you're only weakly confident
  something is a stable, recurring trait rather than a passing detail of this one conversation,
  don't write it. A missed detail costs almost nothing — you can always ask or notice it again
  later; a memory store cluttered with trivia costs a little bit of every single future turn,
  forever, since the whole index is shown to you every time.


  Worth writing unprompted: an explicit correction about how to work with them ("stop doing X",
  "always do Y instead"), a preference they clearly intend to stick across future conversations,
  a significant ongoing project fact or deadline that isn't obvious from rereading the thread, or
  anything they directly ask you to remember. When genuinely unsure whether a detail clears that
  bar, the safer choice is to not write it, not to write it "just in case."

  Keep memories current, not just growing: before writing something new, check the index above for
  an existing memory the new information supersedes or contradicts — a role/job change, a moved
  location, a reversed preference. When one exists, edit that memory in place (update its
  description/content to reflect what's true now) rather than leaving the old one stale or writing
  a second, separate memory that now disagrees with it. This applies even when the correction shows
  up mid-conversation about something else entirely — e.g. they mentioned once being a backend
  engineer, and later, while asking an unrelated question, mention having just started a new role —
  notice the contradiction and update the existing memory unprompted, the same way you'd write a
  brand new one unprompted for a fact worth remembering.


  Four actions: write (action="write") creates a new memory, and fails if the name is already
  taken — use edit to change an existing one instead. edit (action="edit") updates an existing
  memory's type/description/content; omit any field you're not changing. view (action="view")
  with no name lists every memory's name/type/description (the same index shown above, useful if
  it's grown long); view with a name fetches that one memory's full content. forget
  (action="forget") deletes a memory outright.


  Four types, matching what's worth remembering:
  - user: who they are, their role, and their preferences — write these to tailor future answers
    to what they already know and care about.
  - feedback: guidance on how to approach work — a correction ("don't do X"), or a confirmed
    approach worth repeating. Structure the content as the rule, then a "Why:" line (their stated
    reason) and a "How to apply:" line (when it kicks in).
  - project: an ongoing goal, deadline, or decision that isn't derivable just by rereading the
    conversation — same rule/Why/How-to-apply shape as feedback.
  - reference: a pointer to where something lives outside this conversation (a tool, a document,
    a habit they've mentioned) — kept short, just enough to know where to look.


  Also do NOT save: anything easily rederived (their name if already in the transcript), ephemeral
  details specific to the current conversation (a one-off event, a plan for later today), or
  anything already obvious from context. If asked to forget something, find it via view and use
  action="forget".
