<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaris — interactive maps mockups</title>
<!-- Design mockups for docs/plans/interactive-maps.md (issue #143). Standalone: open in a browser.
     Four 390x844 phone screens; pins, list rows, sheet handle and layer toggles are live.
     Map art, place names and walking times are made-up sample content, and screen 4's region map is a
     stand-in illustration, not a real wiki image. -->
<style>
:root{
  --bg:oklch(15% 0.014 65);--surface:oklch(19% 0.014 65);--surface-2:oklch(23% 0.016 65);--surface-3:oklch(28% 0.018 65);
  --border:oklch(30% 0.016 65);--border-strong:oklch(40% 0.02 65);--text:oklch(93% 0.01 75);--dim:oklch(64% 0.014 70);
  --accent:oklch(82% 0.17 78);--accent-strong:oklch(72% 0.18 74);--accent-soft:oklch(82% 0.17 78 / .16);
  --accent-2:oklch(78% 0.06 235);--on-accent:oklch(20% 0.02 65);
  --land:oklch(21% 0.014 65);--water:oklch(26% 0.035 235);--park:oklch(24% 0.035 150);
  --road:oklch(29% 0.016 65);--road-major:oklch(36% 0.02 70);
}
*{box-sizing:border-box}
body{margin:0;background:oklch(12% 0.012 65);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:15px;font-weight:600;margin:0 0 4px}
header{padding:24px 24px 0;max-width:1000px}
header p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:32px;padding:24px}
figure{margin:0}
figcaption{font-size:12px;color:var(--dim);margin-bottom:8px}
.phone{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;border:1px solid var(--border);border-radius:24px;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-2)}
/* chat chrome */
.bar{height:52px;flex-shrink:0;padding:0 8px;display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--border)}
.bar b{font-size:15px;letter-spacing:.02em}
.iconbtn{width:44px;height:44px;background:none;border:0;display:flex;align-items:center;justify-content:center}
.scroll{flex-grow:1;padding:20px 16px 0;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.q{font-size:15px;line-height:1.45}
.prose{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.6}
.cite{font-family:system-ui,sans-serif;font-size:11px;color:var(--accent-2);background:var(--surface-2);padding:1px 5px;border-radius:4px}
.trace{display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;background:none;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--dim);text-align:left}
.composer{flex-shrink:0;padding:12px 16px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.composer .in{flex-grow:1;height:48px;padding:0 18px;display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:24px;font-size:15px;color:var(--dim)}
.composer button{width:48px;height:48px;border-radius:24px;border:0;background:var(--accent);display:flex;align-items:center;justify-content:center}
/* map card */
.card{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden}
.map{position:relative}
.map svg.base{position:absolute;left:0;top:0;display:block}
.chip{position:absolute;height:28px;padding:0 12px;display:flex;align-items:center;background:oklch(15% 0.014 65 / .88);border:1px solid var(--border);border-radius:14px;font-size:12px}
.fab{width:44px;height:44px;background:none;border:0;display:flex;align-items:center;justify-content:center;position:absolute}
.fab span{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:oklch(15% 0.014 65 / .88);border:1px solid var(--border);border-radius:17px}
.attr{position:absolute;left:10px;bottom:6px;font-size:9px;color:var(--dim)}
.foot{padding:12px 14px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--border)}
.foot .grow{flex-grow:1;min-width:0}
.foot .name{font-size:15px;font-weight:600}
.foot .meta{font-size:12px;color:var(--dim);margin-top:2px}
.btn-out{font-size:13px;padding:10px 14px;border:1px solid var(--border-strong);border-radius:10px;text-decoration:none;color:var(--text);background:none;min-height:44px;display:inline-flex;align-items:center}
.landmark{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;transform:rotate(45deg);background:var(--accent-2);border:2px solid var(--bg)}
.lm-label{position:absolute;font-size:11px;color:var(--accent-2);white-space:nowrap}
/* pins */
.pin{position:absolute;width:44px;height:44px;padding:0;background:none;border:0;display:flex;align-items:center;justify-content:center}
.pin i{font-style:normal;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;border:2px solid var(--bg);width:28px;height:28px;font-size:13px;background:var(--accent-strong);color:var(--on-accent)}
.pin.on{z-index:3}
.pin.on i{width:36px;height:36px;background:var(--accent);box-shadow:0 0 0 4px oklch(82% 0.17 78 / .28)}
.pin .tag{position:absolute;left:50%;top:-24px;transform:translateX(-50%);white-space:nowrap;font-size:12px;padding:3px 8px;border-radius:8px;background:oklch(15% 0.014 65 / .92);border:1px solid var(--border);display:none}
.pin.on .tag{display:block}
.static-pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:2px solid var(--bg);background:var(--accent-strong);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.static-pin.muted{border-color:var(--border-strong);background:var(--surface-3);color:var(--dim)}
/* screen 2 */
.full{position:relative;background:var(--land)}
.search{position:absolute;left:16px;right:16px;top:16px;height:48px;display:flex;align-items:center;background:oklch(19% 0.014 65 / .94);border:1px solid var(--border);border-radius:24px}
.search span{flex-grow:1;font-size:14px}.search em{font-style:normal;padding-right:16px;font-size:12px;color:var(--dim)}
.ctl{position:absolute;right:12px;top:84px;display:flex;flex-direction:column;gap:8px}
.ctl button{width:44px;height:44px;border-radius:22px;background:oklch(19% 0.014 65 / .94);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;transition:height .25s ease;height:430px}
.sheet.closed{height:236px}
.handle{width:100%;height:28px;background:none;border:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.handle i{width:40px;height:4px;border-radius:2px;background:var(--border-strong)}
.sheet .hd{padding:0 16px;display:flex;align-items:baseline;justify-content:space-between;flex-shrink:0}
.sheet .hd b{font-size:16px}.sheet .hd span{font-size:12px;color:var(--dim)}
.chips{padding:12px 16px 8px;display:flex;gap:8px;flex-shrink:0}
.chips span{padding:7px 12px;border-radius:16px;font-size:12px;border:1px solid var(--border);color:var(--dim)}
.chips span.on{background:var(--accent-soft);border-color:oklch(82% 0.17 78 / .5);color:var(--accent)}
.rows{padding:0 8px;display:flex;flex-direction:column;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;min-height:56px;border:0;border-radius:12px;background:none;text-align:left}
.prow.on{background:oklch(82% 0.17 78 / .14)}
.prow .b{flex-shrink:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--surface-3)}
.prow.on .b{background:var(--accent);color:var(--on-accent)}
.prow .n{display:block;font-size:15px;font-weight:600}.prow .m{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.acts{padding:8px 16px;display:flex;gap:8px;flex-shrink:0}
.sheet.closed .acts{display:none}
.acts a{flex-grow:1;text-align:center;padding:13px 0;border-radius:12px;font-size:14px;text-decoration:none;border:1px solid var(--border-strong);color:var(--text)}
.acts a.primary{background:var(--accent);color:var(--on-accent);font-weight:600;border:0}
/* layer toggles */
.layers{padding:12px 14px;border-top:1px solid var(--border)}
.tgl-row{display:flex;gap:8px}
.tgl{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:22px;font-size:13px;background:none;border:1px solid var(--border);color:var(--dim)}
.tgl i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}
.tgl[aria-pressed="true"]{background:var(--accent-soft);border-color:oklch(82% 0.17 78 / .5);color:var(--accent)}
.tgl[aria-pressed="true"] i{background:var(--accent)}
.ann{transition:opacity .2s ease}.ann.off{opacity:0}
.pill{position:absolute;right:8px;top:8px;height:44px;padding:0 14px;display:flex;align-items:center;gap:8px;border-radius:22px;font-size:13px;background:oklch(15% 0.014 65 / .92);border:1px solid var(--border-strong)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--border-strong)}
.pill[aria-pressed="true"] i{background:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Interactive maps — mockups</h1>
  <p>Companion to <code>docs/plans/interactive-maps.md</code> (issue #143). Tap pins, list rows, the sheet handle and the layer toggles. Sample content only.</p>
</header>

<div class="row">

  </div>
  <div class="composer"><div class="in">Ask anything</div><button aria-label="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(20% 0.02 65)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
</div>
</figure>

<!-- 2 · Expanded map -->
<figure>
<figcaption>2 · Expanded map</figcaption>

<!-- 3 · Drawn-on annotations -->
<figure>
<figcaption>3 · Drawn-on annotations</figcaption>
<div class="phone">
  <div class="bar"><button class="iconbtn" aria-label="Open sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(64% 0.014 70)" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><b>Polaris</b></div>

            <g id="l-route-label"><rect x="186" y="155" width="46" height="20" rx="10" fill="oklch(15% 0.014 65 / .92)" stroke="oklch(78% 0.06 235 / .7)"/><text x="209" y="169" font-size="11" fill="oklch(78% 0.06 235)" text-anchor="middle">4 min</text></g>

</div>
</figure>

<!-- 4 · Any image -->
<figure>
<figcaption>4 · Any image, not just streets</figcaption>
<div class="phone">
  <div class="bar"><button class="iconbtn" aria-label="Open sidebar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(64% 0.014 70)" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><b>Polaris</b></div>
  <div class="scroll">
    <div><div class="lbl">You</div><div class="q">In Guild Wars 2, where does the meta event happen in this region?</div></div>
    <div class="prose">It happens in the marked area, east of the river. I took the region map from the wiki and drew on a copy, so the original is untouched.</div>
    <div class="card">
      <div class="map" style="height:380px">
        <svg class="base" width="358" height="380" viewBox="0 0 358 380" aria-hidden="true">

<script>
// Sample data — made up for the mockup.
var P1 = [
  {n:1,name:'Café One',x:150,y:128,meta:'2 min walk · Espresso bar'},
  {n:2,name:'Café Two',x:252,y:178,meta:'7 min walk · Roaster and bakery'},
  {n:3,name:'Café Three',x:130,y:224,meta:'9 min walk · Counter service'}
];
var P2 = [
  {n:1,name:'Café One',x:168,y:330,meta:'2 min walk · Espresso bar'},
  {n:2,name:'Café Two',x:292,y:208,meta:'7 min walk · Roaster and bakery'},
  {n:3,name:'Café Three',x:150,y:214,meta:'9 min walk · Counter service'}
];
function pins(host, list, sel, onPick){
  host.querySelectorAll('.pin').forEach(function(e){e.remove();});
  list.forEach(function(p){
    var b=document.createElement('button');
    b.className='pin'+(p.n===sel?' on':'');
    b.style.left=(p.x-22)+'px'; b.style.top=(p.y-22)+'px';
    b.setAttribute('aria-label',p.name+', '+p.meta);
    b.innerHTML='<i>'+p.n+'</i><span class="tag">'+p.name+'</span>';
    b.onclick=function(){onPick(p.n);};
    host.appendChild(b);
  });
}
// Screen 1
var sel1=1;
function draw1(){
  var cur=P1.find(function(p){return p.n===sel1;});
  pins(document.getElementById('m1'),P1,sel1,function(n){sel1=n;draw1();});
  document.getElementById('m1name').textContent=cur.name;
  document.getElementById('m1meta').textContent=cur.meta;
}
draw1();
// Screen 2
var sel2=1;
function draw2(){
  pins(document.getElementById('m2'),P2,sel2,function(n){sel2=n;draw2();});
  document.getElementById('rows').innerHTML=P2.map(function(p){
    return '<button class="prow'+(p.n===sel2?' on':'')+'" data-n="'+p.n+'"><span class="b">'+p.n+'</span><span><span class="n">'+p.name+'</span><span class="m">'+p.meta+'</span></span></button>';
  }).join('');
  document.querySelectorAll('#rows .prow').forEach(function(r){r.onclick=function(){sel2=+r.dataset.n;draw2();};});
}
draw2();
document.getElementById('handle').onclick=function(){document.getElementById('sheet').classList.toggle('closed');};
// Screen 3
document.querySelectorAll('.tgl').forEach(function(t){
  t.onclick=function(){
    var on=t.getAttribute('aria-pressed')!=='true';
    t.setAttribute('aria-pressed',on);
    document.getElementById(t.dataset.layer).classList.toggle('off',!on);
    // the route's time label follows the Route layer, like a shape carrying its own label
    if(t.dataset.layer==='l-route') document.getElementById('l-route-label').style.opacity=on?1:0;
  };
});
// Screen 4
var it=document.getElementById('img-toggle');
it.onclick=function(){
  var on=it.getAttribute('aria-pressed')!=='true';
  it.setAttribute('aria-pressed',on);
  document.getElementById('img-ann').classList.toggle('off',!on);
};
</script>
